<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 369" fill="none" role="img" aria-labelledby="title desc"><title id="title">Three distinct evidence states</title><desc id="desc">Implemented capabilities include authenticated workspaces, UI and MCP parity, and isolated execution control. Live end-to-end model calls, combined candidate checks, trusted landing and a working preview still need proof. Workers Builds integration, secret and database execution, and production hardening remain deferred.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#6b798b" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="600" height="80" rx="7" fill="#2a2018" stroke="#aa754b"/><text x="320.0" y="50" font-size="16" font-weight="600" fill="#e1e5ec">Keep implementation and verification separate</text><text x="320.0" y="75" font-size="13" fill="#a1aab7">A plan, a deployment and a live result are different evidence</text><rect x="20" y="142" width="185" height="124" rx="7" fill="#161a20" stroke="#414854"/><text x="112.5" y="172" font-size="16" font-weight="600" fill="#e1e5ec">Implemented</text><text x="112.5" y="197" font-size="13" fill="#a1aab7">Workspace access</text><text x="112.5" y="219" font-size="13" fill="#a1aab7">UI + MCP controls</text><text x="112.5" y="241" font-size="13" fill="#a1aab7">Execution state machine</text><rect x="227" y="142" width="185" height="124" rx="7" fill="#2a2018" stroke="#aa754b"/><text x="319.5" y="172" font-size="16" font-weight="600" fill="#e1e5ec">Live proof pending</text><text x="319.5" y="197" font-size="13" fill="#a1aab7">Two model-backed tasks</text><text x="319.5" y="219" font-size="13" fill="#a1aab7">Combined tests + landing</text><text x="319.5" y="241" font-size="13" fill="#a1aab7">Functioning preview</text><rect x="434" y="142" width="185" height="124" rx="7" fill="#161a20" stroke="#414854" stroke-dasharray="5 4"/><text x="526.5" y="172" font-size="16" font-weight="600" fill="#e1e5ec">Deferred</text><text x="526.5" y="197" font-size="13" fill="#a1aab7">Workers Builds wiring</text><text x="526.5" y="219" font-size="13" fill="#a1aab7">Secrets + migrations</text><text x="526.5" y="241" font-size="13" fill="#a1aab7">Identity + recovery</text><text x="320" y="336" font-size="13" fill="#a1aab7">Each capability needs its own source, check and live evidence</text></g></svg>
