<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" fill="none" role="img" aria-labelledby="title desc"><title id="title">Authorization combines identity, scope and state</title><desc id="desc">UI and MCP requests resolve an active principal. Workspace membership, role actions, repository and resource scope are checked. Task credentials add independent expiry, revocation and request and execution budgets. Privileged operations also enforce exact revision and mission state. Requests are permitted or denied.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#6b798b" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="600" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="320.0" y="50" font-size="16" font-weight="600" fill="#e1e5ec">UI or MCP request</text><text x="320.0" y="75" font-size="13" fill="#a1aab7">Resolve an active session or scoped task credential</text><path d="M320 100v31" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="132" width="185" height="102" rx="7" fill="#161a20" stroke="#414854"/><text x="112.5" y="162" font-size="16" font-weight="600" fill="#e1e5ec">Role + grants</text><text x="112.5" y="187" font-size="13" fill="#a1aab7">Action permission</text><text x="112.5" y="209" font-size="13" fill="#a1aab7">Workspace membership</text><rect x="227" y="132" width="185" height="102" rx="7" fill="#2a2018" stroke="#aa754b"/><text x="319.5" y="162" font-size="16" font-weight="600" fill="#e1e5ec">Resource scope</text><text x="319.5" y="187" font-size="13" fill="#a1aab7">Repository / Stream</text><text x="319.5" y="209" font-size="13" fill="#a1aab7">Exact resource grant</text><rect x="434" y="132" width="185" height="102" rx="7" fill="#161a20" stroke="#414854"/><text x="526.5" y="162" font-size="16" font-weight="600" fill="#e1e5ec">Credential limits</text><text x="526.5" y="187" font-size="13" fill="#a1aab7">Expiry + revocation</text><text x="526.5" y="209" font-size="13" fill="#a1aab7">Requests + executions</text><path d="M112 234v26h208v25" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 234v51" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M526 234v26H320" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="110" y="287" width="420" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="320.0" y="317" font-size="16" font-weight="600" fill="#e1e5ec">Operation state guards</text><text x="320.0" y="342" font-size="13" fill="#a1aab7">Required checks, approval and exact revision</text><path d="M230 367v22H170v18" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M410 367v22h60v18" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170" y="429" font-size="16" font-weight="600" fill="#e1e5ec">Allow the action</text><text x="470" y="429" font-size="16" font-weight="600" fill="#e1e5ec">Deny with a useful error</text></g></svg>
