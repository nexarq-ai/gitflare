<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 493" fill="none" role="img" aria-labelledby="title desc"><title id="title">A supported Artifacts path, with Gitflare wiring still planned</title><desc id="desc">Cloudflare supports Artifacts repositories in Workers Builds. The desired Gitflare flow is exact candidate approval and canonical landing, then a configured build trigger and commit-bound result. Gitflare does not yet configure Workers Builds or ingest build results. Deploy permissions and trusted credentials are separate from task forks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#6b798b" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="600" height="80" rx="7" fill="#2a2018" stroke="#aa754b" stroke-dasharray="5 4"/><text x="320.0" y="50" font-size="16" font-weight="600" fill="#e1e5ec">Gitflare integration is planned</text><text x="320.0" y="75" font-size="13" fill="#a1aab7">No configured Builds connection or displayed build result</text><rect x="20" y="138" width="180" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="110.0" y="168" font-size="16" font-weight="600" fill="#e1e5ec">Approved candidate</text><text x="110.0" y="193" font-size="13" fill="#a1aab7">Exact canonical landing</text><path d="M200 178h28" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230" y="138" width="180" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="320.0" y="168" font-size="16" font-weight="600" fill="#e1e5ec">Artifacts repository</text><text x="320.0" y="193" font-size="13" fill="#a1aab7">Native Git integration</text><path d="M410 178h28" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="440" y="138" width="180" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="530.0" y="168" font-size="16" font-weight="600" fill="#e1e5ec">Workers Builds</text><text x="530.0" y="193" font-size="13" fill="#a1aab7">Configure in Cloudflare</text><path d="M530 218v42" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="262" width="280" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="480.0" y="292" font-size="16" font-weight="600" fill="#e1e5ec">Build + deploy target</text><text x="480.0" y="317" font-size="13" fill="#a1aab7">Protected deployment credentials</text><path d="M340 302h-36" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="262" width="280" height="80" rx="7" fill="#161a20" stroke="#414854" stroke-dasharray="5 4"/><text x="160.0" y="292" font-size="16" font-weight="600" fill="#e1e5ec">Commit-bound result</text><text x="160.0" y="317" font-size="13" fill="#a1aab7">Planned event ingestion</text><rect x="20" y="384" width="600" height="80" rx="7" fill="#161a20" stroke="#414854"/><text x="320.0" y="414" font-size="16" font-weight="600" fill="#e1e5ec">Task forks cannot deploy the canonical Worker</text><text x="320.0" y="439" font-size="13" fill="#a1aab7">Deployment permission records do not implement a deployment executor</text></g></svg>
