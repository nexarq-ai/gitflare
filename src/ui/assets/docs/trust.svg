<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Separate authority for task execution and landing</title>
<desc id="desc">Workspace owners and authorized AI clients request actions through the Worker authorization boundary. Task Containers receive only scoped fork access and gateway inference. Approval, canonical writes, and deployment credentials stay outside those task sandboxes. Isolated candidate previews have expiring and revocable access.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#6b798b" stroke-width="1.5"/></marker></defs>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<rect x="153" y="16" width="334" height="49" rx="7" fill="#161a20" stroke="#414854"/>
<text x="320" y="47" fill="#e1e5ec" font-size="16" font-weight="600">Owners + authorized AI clients</text>
<path d="M320 65v32" stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="112" y="98" width="416" height="50" rx="7" fill="#2a2018" stroke="#aa754b"/>
<text x="320" y="128" fill="#e1e5ec" font-size="16" font-weight="600">Worker authorization + mission state checks</text>
<g stroke="#6b798b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M220 148v22h-62v24"/><path d="M420 148v22h62v24"/></g>
<rect x="18" y="195" width="283" height="166" rx="9" fill="#11161e" stroke="#526174" stroke-dasharray="5 4"/>
<rect x="339" y="195" width="283" height="166" rx="9" fill="#161a20" stroke="#414854"/>
<g fill="#e1e5ec" font-size="17" font-weight="600"><text x="160" y="229">Task sandbox</text><text x="480" y="229">Trusted control plane</text></g>
<g fill="#a1aab7" font-size="14"><text x="160" y="263">Scoped task fork access</text><text x="160" y="289">Bounded tools + gateway inference</text><text x="160" y="328" fill="#a9bfff">No owner or canonical credentials</text><text x="480" y="263">Exact-candidate approval</text><text x="480" y="289">Trusted canonical write</text><text x="480" y="328">Preview capability expiry + revocation</text></g>
</g></svg>
